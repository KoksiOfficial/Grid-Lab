apiVersion: apps/v1
kind: Deployment
metadata:
  name: ieee118-web
  labels:
    app: ieee118-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ieee118-web
  template:
    metadata:
      labels:
        app: ieee118-web
    spec:
      containers:
        - name: ieee118-sim
          image: my-grid-lab/ieee118-sim:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: /data
            - name: SCRIPT_DIR
              value: /scripts
            - name: SIM_WORKERS
              value: "1"
            - name: SIM_K
              value: "2"
            - name: SIM_SCENARIO
              value: "83810"
            - name: SIM_SEED
              value: "42"
            - name: SIM_TRIALS_PER_STEP
              value: "1000"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
